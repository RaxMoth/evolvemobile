<svg xmlns="http://www.w3.org/2000/svg" width="128" height="48" viewBox="0 0 128 48">
<!-- Ground contact shadow of every character rig: a white mask (CharacterRig tints it with the palette's ink at its shadow_alpha and sizes it to its shadow_radius). Dense contact core, soft falloff to nothing at the rim. -->
<defs><radialGradient id="blob"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.78" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>
<ellipse cx="64" cy="24" rx="64" ry="24" fill="url(#blob)"/>
</svg>
